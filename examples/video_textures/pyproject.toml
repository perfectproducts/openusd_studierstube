[project]
name = "video-textures"
version = "0.1.0"
description = "Render an OpenUSD scene with an .mp4 video texture with NVIDIA ovrtx: a still, an MP4 or a GIF."
requires-python = ">=3.10,<3.14"
dependencies = [
    "ovrtx==0.6.0.1791947691",
    "ovstage==0.3.0.1791986420",
    "numpy>=2.0",
    "pillow>=10.0",
    "imageio-ffmpeg==0.6.0",
]

[tool.uv]
package = false
